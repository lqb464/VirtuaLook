# VirtuaLook stack: API (FastAPI) + UI (Streamlit)
#
# Usage:
#   docker compose up --build -d
#   Open UI: http://localhost:3000
#   Open API: http://localhost:8000

services:
  virtulook-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: virtulook-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      HOST: 0.0.0.0
      PORT: 8000
      VTON_BACKEND: mock
      UPLOAD_DIR: /app/storage
    volumes:
      - virtulook_data:/app/storage

  virtulook-ui:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: virtulook-ui
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      INTERNAL_API_URL: http://virtulook-api:8000
      PORT: 3000
    depends_on:
      - virtulook-api

volumes:
  virtulook_data:
